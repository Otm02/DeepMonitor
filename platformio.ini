; DeepMonitor — multi-target firmware
; Flash tomorrow:  pio run -e m5stickc-6886 -t upload
; External IMU:    pio run -e m5stickc-6050 -t upload
; Production PCB:  pio run -e esp32-wroom-6050 -t upload 

                [platformio]  

[common]
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

[common_m5stickc]
platform = espressif32
board = m5stick-c
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
; Plus2 overrides — ESP32-PICO-V3-02, 8 MB flash
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.f_cpu = 240000000L

; ── M5StickC Plus2 — onboard MPU6886 (tomorrow's test build) ───────────────
[env:m5stickc-6886]
extends = common_m5stickc
build_flags =
    ${common.build_flags}
    -DBOARD_M5STICKC_6886
lib_deps =
    m5stack/M5Unified @ ^0.1.16
    m5stack/M5GFX @ ^0.1.15

; ── M5StickC Plus2 — external MPU-6050 on Grove I2C ─────────────────────────
[env:m5stickc-6050]
extends = common_m5stickc
build_flags =
    ${common.build_flags}
    -DBOARD_M5STICKC_6050
lib_deps =
    m5stack/M5Unified @ ^0.1.16
    m5stack/M5GFX @ ^0.1.15

; ── Production ESP32-WROOM-32E + MPU-6050 + W25Q32 + 18650 ─────────────────
[env:esp32-wroom-6050]
platform = espressif32
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags =
    ${common.build_flags}
    -DBOARD_ESP32WROOM_6050